version: 1
filesystem_policy:
  read_only:
    - /usr
    - /opt/voltline/catalog
  read_write:
    - /opt/voltline/proposals
process:
  run_as_user: "1500"
  run_as_group: "1500"
network_policies:
  store_prices:
    name: store-prices
    endpoints:
      - host: prices.voltline.test
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
        credential_binding:
          provider: voltline-prices
    binaries:
      - path: /usr/bin/curl
