version: 1
filesystem_policy:
  read_only:
    - /usr
    - /opt/voltline/catalog
  read_write:
    - /tmp
    - /opt/voltline/proposals
    - /opt/voltline/catalog
landlock:
  compatibility: best_effort
process:
  run_as_user: "1500"
  run_as_group: "1500"
network_policies:
  supplier_feed:
    name: supplier-feed
    endpoints:
      - host: feed.northspan-supply.test
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
  store_prices:
    name: store-prices
    endpoints:
      - host: prices.voltline.test
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/gpu-prices
    binaries:
      - path: /usr/bin/curl
