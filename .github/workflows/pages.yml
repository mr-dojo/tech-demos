name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/graphify-code-map/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# contents: read is required for checkout. pages and id-token publish the site.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        working-directory: apps/graphify-code-map
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/graphify-code-map
        env:
          # Project Pages origin is https://mr-dojo.github.io/tech-demos/
          VITE_BASE_PATH: /tech-demos/graphify-code-map/
        run: bun run build

      - name: Assemble site
        run: |
          mkdir -p site
          # Static demos are published at /<slug>/. Add another copy + list item
          # for the next static app. Leave server apps (apps/openui-genui) out.
          mkdir -p site/graphify-code-map
          cp -a apps/graphify-code-map/dist/. site/graphify-code-map/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>tech-demos</title>
            </head>
            <body>
              <h1>tech-demos</h1>
              <ul>
                <li><a href="graphify-code-map/">Codebase Atlas</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
